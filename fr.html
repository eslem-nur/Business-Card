<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#A06872">

    <link rel="stylesheet" href="style.css">

    
    <title>Carte de visite | Eslem Nur Çetin</title>
    <meta name="description" content="Eslem Nur Çetin - Étudiante en théologie & Développeuse web Carte de visite">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
     <!-- Ajouter le manifeste PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Business-Card/PWA/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/Business-Card/PWA/favicon-96x96.png" />
    <link rel="manifest" href="/Business-Card/PWA/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/Business-Card/PWA/favicon.svg" />
    <link rel="shortcut icon" href="/Business-Card/PWA/favicon.ico" />

    <!-- Enregistrement du Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Business-Card/PWA/sw.js', { scope: '/Business-Card/' })
            .then(reg => console.log('Service Worker enregistré avec succès !', reg.scope))
            .catch(err => console.log('Échec de l\'enregistrement du Service Worker :', err));
        });
      }
    </script>

</head>


<body>

    <!-- CONTRÔLES HAUT DROIT -->
    <div class="top-controls">
        <button id="themeToggle" class="theme-toggle" aria-label="Changer le thème">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- SÉLECTEUR DE DESIGN -->
    <div class="design-selector">
        <div class="design-dot active" onclick="changeDesign(0)" title="Design 1"></div>
        <div class="design-dot" onclick="changeDesign(1)" title="Design 2"></div>
        <div class="design-dot" onclick="changeDesign(2)" title="Design 3"></div>
        <div class="design-dot" onclick="changeDesign(3)" title="Design 4"></div>
    </div>

    <!-- CARTE -->
    <div class="card-frame" id="cardFrame">
        <!-- COUCHE INTERNE RETOURNEMENT -->
        <div class="card-inner" id="cardInner">
            
            <!-- FACE AVANT : Design avant -->
            <div class="card-front">
                <img src="Png/Style-1.png" alt="Carte de visite face avant" id="frontImage">
                
                <span class="flip-hint"><i class="fas fa-rotate"></i> Retourner</span>
                
                <div class="overlay-actions">
                    <button class="mini-btn" onclick="copyEmail()" title="Copier l'e-mail">
                        <i class="fas fa-envelope"></i>
                    </button>
                    <button class="mini-btn" onclick="flipCard()" title="Retourner">
                        <i class="fas fa-rotate"></i>
                    </button>
                </div>
            </div>
            
            <!-- FACE ARRIÈRE : Design arrière + Boutons -->
            <div class="card-back">
                <img src="Png/Style-1-back.png" alt="Carte de visite face arrière" id="backImage">
              
              <button class="back-flip-btn" onclick="flipCard()" title="Montrer la face avant">
        <i class="fas fa-rotate-left"></i>
    </button>
                
                <div class="back-overlay">
                    <span class="back-title">Mes connexions</span>
                    
                    <div class="quick-links">
                        <a href="https://eslem-nur.github.io/official/index.html" target="_blank" rel="noopener noreferrer" class="quick-link" title="Portfolio">
                            <i class="fas fa-user"></i>
                        </a>
                        <a href="https://github.com/eslem-nur" target="_blank" rel="noopener noreferrer" class="quick-link" title="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        
                        <a href="http://linktr.ee/eslemnur" target="_blank" rel="noopener noreferrer" class="quick-link" title="Linktree">
                            <i class="fas fa-link"></i>
                        </a>
                        <a href="mailto:eslemnur-official@proton.me" class="quick-link" title="E-mail">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BARRE D'ACTION -->
    <div class="action-bar">
        <button class="action-btn primary" onclick="saveContact()">
            <i class="fas fa-address-card"></i> Enregistrer le contact
        </button>
        <button class="action-btn" onclick="shareCard()">
            <i class="fas fa-share-nodes"></i> Partager
        </button>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>
    <script src="script.js"></script>
</body>
</html>
