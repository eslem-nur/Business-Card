<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#A06872">

    <link rel="stylesheet" href="style.css">

    
    <title>البطاقة المهنية | Eslem Nur Çetin</title>
    <meta name="description" content="أسلم نور تشتين - طالبة علم اللاهوت ومطورة ويب البطاقة المهنية">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
     <!-- إضافة ملخص PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Business-Card/PWA/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/Business-Card/PWA/favicon-96x96.png" />
    <link rel="manifest" href="/Business-Card/PWA/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/Business-Card/PWA/favicon.svg" />
    <link rel="shortcut icon" href="/Business-Card/PWA/favicon.ico" />

    <!-- تسجيل عامل الخدمة PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Business-Card/PWA/sw.js', { scope: '/Business-Card/' })
            .then(reg => console.log('تم تسجيل عامل الخدمة بنجاح!', reg.scope))
            .catch(err => console.log('فشل تسجيل عامل الخدمة:', err));
        });
      }
    </script>

</head>


<body>

    <!-- التحكمات العلوية اليمنى -->
    <div class="top-controls">
        <button id="themeToggle" class="theme-toggle" aria-label="تغيير المظهر">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- منتقى التصميم -->
    <div class="design-selector">
        <div class="design-dot active" onclick="changeDesign(0)" title="التصميم 1"></div>
        <div class="design-dot" onclick="changeDesign(1)" title="التصميم 2"></div>
        <div class="design-dot" onclick="changeDesign(2)" title="التصميم 3"></div>
        <div class="design-dot" onclick="changeDesign(3)" title="التصميم 4"></div>
    </div>

    <!-- البطاقة -->
    <div class="card-frame" id="cardFrame">
        <!-- الطبقة الداخلية للقلب -->
        <div class="card-inner" id="cardInner">
            
            <!-- الوجه الأمامي: التصميم الأمامي -->
            <div class="card-front">
                <img src="Png/Style-1.png" alt="البطاقة المهنية الوجه الأمامي" id="frontImage">
                
                <span class="flip-hint"><i class="fas fa-rotate"></i> اقلب</span>
                
                <div class="overlay-actions">
                    <button class="mini-btn" onclick="copyEmail()" title="نسخ البريد الإلكتروني">
                        <i class="fas fa-envelope"></i>
                    </button>
                    <button class="mini-btn" onclick="flipCard()" title="اقلب">
                        <i class="fas fa-rotate"></i>
                    </button>
                </div>
            </div>
            
            <!-- الوجه الخلفي: التصميم الخلفي + الأزرار -->
            <div class="card-back">
                <img src="Png/Style-1-back.png" alt="البطاقة المهنية الوجه الخلفي" id="backImage">
              
              <button class="back-flip-btn" onclick="flipCard()" title="إظهار الوجه الأمامي">
        <i class="fas fa-rotate-left"></i>
    </button>
                
                <div class="back-overlay">
                    <span class="back-title">روابطي</span>
                    
                    <div class="quick-links">
                        <a href="https://eslem-nur.github.io/official/index.html" target="_blank" rel="noopener noreferrer" class="quick-link" title="المعرض">
                            <i class="fas fa-user"></i>
                        </a>
                        <a href="https://github.com/eslem-nur" target="_blank" rel="noopener noreferrer" class="quick-link" title="جيت هب">
                            <i class="fab fa-github"></i>
                        </a>
                        
                        <a href="http://linktr.ee/eslemnur" target="_blank" rel="noopener noreferrer" class="quick-link" title="لينكتري">
                            <i class="fas fa-link"></i>
                        </a>
                        <a href="mailto:eslemnur-official@proton.me" class="quick-link" title="البريد الإلكتروني">
                            <i class="fas fa-envelope"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- شريط الإجراء -->
    <div class="action-bar">
        <button class="action-btn primary" onclick="saveContact()">
            <i class="fas fa-address-card"></i> حفظ جهة الاتصال
        </button>
        <button class="action-btn" onclick="shareCard()">
            <i class="fas fa-share-nodes"></i> مشاركة
        </button>
    </div>

    <!-- الإشعار المنبثق -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>
    <script src="script.js"></script>
</body>
</html>
